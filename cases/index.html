6], [4, "Water Heaters", 2.04], [5, "Camcorders", 2.02]]}}, "extra_sql": {"title": "Top five subcategories by profit", "sql": "WITH sub AS (\n    SELECT p.Subcategory\n         , SUM(s.Quantity * (p.Unit_Price_USD - p.Unit_Cost_USD)) AS profit\n    FROM GBE_Sales s\n    JOIN GBE_Products p ON p.ProductKey = s.ProductKey\n    GROUP BY p.Subcategory\n), ranked AS (\n    SELECT *, RANK() OVER (ORDER BY profit DESC) AS rnk\n    FROM sub\n)\nSELECT rnk, Subcategory, ROUND(profit / 1000000.0, 2) AS profit_m\nFROM ranked\nWHERE rnk <= 5\nORDER BY rnk", "result": "sub"}, "metrics": [["Revenue", "Sum of quantity × unit price (USD)."], ["Profit", "Sum of quantity × (unit price − unit cost)."], ["Margin %", "Profit ÷ revenue."]], "viz_specs": [{"type": "bar", "result": "cat", "x": "Category", "series": [{"col": "revenue_m", "label": "Revenue"}, {"col": "profit_m", "label": "Profit"}], "fmt": "m1", "title": "Computers and home appliances lead on revenue and profit", "sub": "Revenue and profit by category, $M, all years.", "why": "Two values per category in the same unit: grouped bars."}, {"type": "bar", "result": "cat", "x": "Category", "series": [{"col": "margin_pct", "label": "Margin"}], "fmt": "pct0", "ymin": 0, "ymax": 100, "colors": [0, 0, 0, 0, 0, 0, 0, 0], "title": "Margins are close in every category", "sub": "Profit as a percent of revenue, by category.", "why": "On a 0 to 100 scale, near-equal bars show that margin does not separate the categories."}], "answer": {"model": ["Computers earn the most profit ($11.3M on $19.3M of revenue), followed by home appliances ($6.3M). Together they make 54% of all profit.", "Margins are almost the same everywhere, from 55% (Games and Toys) to 61% (Music, Movies and Audio Books), so the profit ranking follows the revenue ranking. The most profitable subcategory is Desktops ($5.63M).", "Judge the range by volume, since no category is a profit trap and none is a hidden winner. Games and toys are the smallest at $0.72M of revenue. This uses list prices and costs, so it ignores discounts and returns."], "checks": ["I multiplied quantity by price and cost on each line.", "I compared revenue rank with profit rank.", "I computed margin from totals.", "I gave one action and one caveat."]}}, {"id": "gbe-stores", "dataset": "gbe", "title": "Which country's stores earn the most per square meter?", "minutes": 20, "rank": "C", "skills": ["CTE", "JOIN", "ratio per unit of space"], "brief": {"from_": "Marcus Hale, Head of Retail Operations", "subject": "Store space: where does it work hardest?", "body": ["We are choosing where to put the next store budget. Total revenue by country favors the big markets, so I want revenue per square meter of store space.", "Use 2019, the last full year before the drop in 2020. Count physical stores only (the online store has no floor space), and only stores that were open for the whole year."], "ask": "Reply in three sentences: which countries use their space best, which worst, and what to do with the budget.", "facts": ["<code>GBE_Stores<\/code> has the country, the floor space (<code>Square_Meters<\/code>) and the open date of each store.", "Online orders sit under <code>StoreKey = 0<\/code>. Exclude them."]}, "questions": ["What is the revenue per square meter in each country?", "Which stores should be left out so the comparison is fair?", "How big is the gap between the best and the worst country?"], "frame": {"nudge": "Revenue per square meter divides two things that live in different tables. At what level do you add each one up so that neither is counted twice?", "tree": ["<b>Which countries use space best?<\/b>", ["Revenue per store in 2019", "Floor space per store", "Both rolled up to country, then revenue ÷ space"]], "hyp": ["The country with the most stores is not the one with the best revenue per square meter.", "Small stores earn more per square meter."], "traps": ["Add revenue up per store first. Joining sales to stores row by row repeats the floor space on every sale.", "Stores that opened in 2019 had only part of a year. Leave them out.", "Some stores sold nothing in 2019. They are not in the revenue table and drop out of the join."]}, "data": {"tables": [["GBE_Sales", 1, "Order lines with the store key and the date."], ["GBE_Products", 1, "Unit price to turn quantity into revenue."], ["GBE_Stores", 1, "Country, floor space and open date."], ["GBE_Customers", 0, "Customers are not part of this question."], ["GBE_Exchange_Rates", 0, "Prices are already in USD."]], "grain": ["<code>GBE_Sales<\/code>: one row per order line, many per store. Sum to one row per store <b>before<\/b> you join to the stores table.", "<code>GBE_Stores<\/code>: one row per store, so each store's floor space is counted once."], "goal": "One row per country: stores, floor space, 2019 revenue and revenue per square meter.", "skeleton": "WITH store_rev AS (\n    SELECT s.StoreKey, SUM(s.Quantity * p.Unit_Price_USD) AS revenue\n    FROM GBE_Sales s\n    JOIN GBE_Products p ON p.ProductKey = s.ProductKey\n    WHERE s.StoreKey <> 0\n      AND s.Order_Date >= ____ AND s.Order_Date < ____\n    GROUP BY s.StoreKey\n)\nSELECT st.Country\n     , COUNT(*) AS stores\n     , SUM(st.Square_Meters) AS square_meters\n     , ...                       -- revenue per square meter\nFROM GBE_Stores st\nJOIN store_rev r ON ____\nWHERE st.Open_Date < ____\nGROUP BY st.Country", "solution": "WITH store_rev AS (\n    SELECT s.StoreKey\n         , SUM(s.Quantity * p.Unit_Price_USD) AS revenue\n    FROM GBE_Sales s\n    JOIN GBE_Products p ON p.ProductKey = s.ProductKey\n    WHERE s.StoreKey <> 0\n      AND s.Order_Date >= '2019-01-01' AND s.Order_Date < '2020-01-01'\n    GROUP BY s.StoreKey\n)\nSELECT st.Country\n     , COUNT(*)                                          AS stores\n     , SUM(st.Square_Meters)                             AS square_meters\n     , ROUND(SUM(r.revenue) / 1000000.0, 2)              AS revenue_m\n     , ROUND(SUM(r.revenue) / SUM(st.Square_Meters), 0)  AS usd_per_sqm\nFROM GBE_Stores st\nJOIN store_rev r ON r.StoreKey = st.StoreKey\nWHERE st.Open_Date < '2019-01-01'\nGROUP BY st.Country\nORDER BY usd_per_sqm DESC", "result": "stores", "watch": ["Joining sales rows straight to stores and then summing <code>Square_Meters<\/code> adds each store's space once per sale.", "Revenue and floor space must cover the same stores, so both come from the joined rows."]}, "results": {"stores": {"cols": ["Country", "stores", "square_meters", "revenue_m", "usd_per_sqm"], "rows": [["United States", 20, 32385, 7.85, 242.0], ["Canada", 3, 4815, 1.13, 234.0], ["Italy", 2, 3100, 0.56, 181.0], ["France", 7, 2390, 0.39, 164.0], ["United Kingdom", 6, 10500, 1.7, 162.0], ["Germany", 7, 10790, 1.35, 125.0], ["Netherlands", 4, 4900, 0.52, 105.0], ["Australia", 4, 6595, 0.69, 104.0]]}, "allstores": {"cols": ["Country", "stores", "square_meters"], "rows": [["Australia", 6, 9260], ["Canada", 5, 7130], ["France", 7, 2390], ["Germany", 9, 12750], ["Italy", 3, 4300], ["Netherlands", 5, 6125], ["United Kingdom", 7, 12600], ["United States", 24, 37990]]}}, "extra_sql": {"title": "For comparison: all stores per country, whether or not they sold in 2019", "sql": "SELECT st.Country\n     , COUNT(*)                                       AS stores\n     , SUM(st.Square_Meters)                          AS square_meters\nFROM GBE_Stores st\nWHERE st.StoreKey <> 0\nGROUP BY st.Country\nORDER BY st.Country", "result": "allstores"}, "metrics": [["Revenue per store", "Sum of quantity × unit price per store in 2019."], ["Revenue per square meter", "Country revenue ÷ country floor space, same stores in both."], ["Comparable stores", "Open before the year starts and with sales in the year."]], "viz_specs": [{"type": "bar", "result": "stores", "x": "Country", "series": [{"col": "usd_per_sqm", "label": "Revenue per square meter"}], "fmt": "usd0", "colors": [1, 0, 0, 0, 0, 0, 0, 0], "title": "US stores earn more than twice what Australian stores do per square meter", "sub": "2019 revenue per square meter of floor space, USD, stores open all year.", "why": "One value per country, ranked: bars from zero."}], "answer": {"model": ["The United States uses its space best at $242 per square meter in 2019, and Australia uses it worst at $104.", "The gap is 2.3 times. Canada ($234) is close behind the US, then Italy ($181) and France ($164), while Germany ($125) and the Netherlands ($105) sit near the bottom. The US result comes from 20 comparable stores, so it is not one lucky shop.", "Put the next budget into the US and look at Australia and the Netherlands before adding space there. Floor space is only one driver: store age, local prices and product mix are not in this data."], "checks": ["I summed revenue per store before joining to the stores table.", "I used comparable stores only.", "I excluded the online store.", "I gave one action and one caveat."]}}, {"id": "gbe-2020", "dataset": "gbe", "title": "Revenue fell in 2020. Did online hold up better than stores?", "minutes": 20, "rank": "C", "skills": ["CASE WHEN", "year-over-year", "channel split"], "brief": {"from_": "Rosa Lindqvist, COO", "subject": "2020 against 2019, by channel", "body": ["Revenue dropped sharply in 2020. The board asks whether our online store cushioned the fall, because the plan for next year leans on it.", "Compare each quarter of 2020 with the same quarter of 2019, for online and for stores separately."], "ask": "Reply in three sentences: how big the fall was, whether online did better, and what that means for the plan.", "facts": ["Online orders have <code>StoreKey = 0<\/code> in <code>GBE_Sales<\/code>. All other keys are physical stores.", "Revenue = quantity × unit price (USD)."]}, "questions": ["How much did total revenue fall in 2020?", "In which quarters did the fall happen, for online and for stores?", "Did online fall less than the stores?"], "frame": {"nudge": "Compare each 2020 quarter with the same quarter in 2019, not with the quarter before it. Why does that matter for retail data?", "tree": ["<b>Did online cushion the fall?<\/b>", ["Revenue per year, to size the fall and check the date range", "2020 as a percent of 2019 for each quarter and channel", "Online's share of revenue in each year"]], "hyp": ["Online fell less than stores in the first months of the crisis.", "The fall is large in both channels in the second half."], "traps": ["Check the date range first. The last year in the data is a part-year.", "Compare the same quarter of two years to remove seasonality.", "Do not put 0 and 1 flags on a chart. Say online and stores."]}, "data": {"tables": [["GBE_Sales", 1, "Order lines with date, store key and quantity."], ["GBE_Products", 1, "Unit price to turn quantity into revenue."], ["GBE_Stores", 0, "Online is already identified by StoreKey = 0."], ["GBE_Customers", 0, "Customers are not part of this question."]], "grain": ["<code>GBE_Sales<\/code>: one row per order line.", "<code>GBE_Products<\/code>: one row per product, so the join does not duplicate lines."], "goal": "One row per quarter: 2020 revenue as a percent of the same quarter in 2019, for online and for stores.", "skeleton": "-- Step 0: size the year and check the dates\nSELECT YEAR(s.Order_Date), ROUND(SUM(s.Quantity * p.Unit_Price_USD) / 1000000.0, 2), MIN(s.Order_Date), MAX(s.Order_Date)\nFROM GBE_Sales s JOIN GBE_Products p ON p.ProductKey = s.ProductKey\nGROUP BY YEAR(s.Order_Date);\n\n-- Step 1: one row per quarter, four sums (online/store x 2019/2020)\nWITH q AS (\n    SELECT CASE WHEN MONTH(s.Order_Date) <= 3 THEN 'Q1' ... END AS quarter\n         , SUM(CASE WHEN s.StoreKey = 0 AND YEAR(s.Order_Date) = 2019 THEN ____ ELSE 0 END) AS online_2019\n         , ...\n    FROM ...\n)\nSELECT quarter, ...        -- 2020 as % of 2019 for each channel\nFROM q", "solution": "WITH q AS (\n    SELECT CASE WHEN MONTH(s.Order_Date) <= 3 THEN 'Q1'\n              WHEN MONTH(s.Order_Date) <= 6 THEN 'Q2'\n              WHEN MONTH(s.Order_Date) <= 9 THEN 'Q3'\n              ELSE 'Q4' END AS quarter\n         , SUM(CASE WHEN s.StoreKey = 0 AND YEAR(s.Order_Date) = 2019 THEN s.Quantity * p.Unit_Price_USD ELSE 0 END) AS online_2019\n         , SUM(CASE WHEN s.StoreKey = 0 AND YEAR(s.Order_Date) = 2020 THEN s.Quantity * p.Unit_Price_USD ELSE 0 END) AS online_2020\n         , SUM(CASE WHEN s.StoreKey <> 0 AND YEAR(s.Order_Date) = 2019 THEN s.Quantity * p.Unit_Price_USD ELSE 0 END) AS store_2019\n         , SUM(CASE WHEN s.StoreKey <> 0 AND YEAR(s.Order_Date) = 2020 THEN s.Quantity * p.Unit_Price_USD ELSE 0 END) AS store_2020\n    FROM GBE_Sales s\n    JOIN GBE_Products p ON p.ProductKey = s.ProductKey\n    WHERE s.Order_Date >= '2019-01-01' AND s.Order_Date < '2021-01-01'\n    GROUP BY CASE WHEN MONTH(s.Order_Date) <= 3 THEN 'Q1'\n              WHEN MONTH(s.Order_Date) <= 6 THEN 'Q2'\n              WHEN MONTH(s.Order_Date) <= 9 THEN 'Q3'\n              ELSE 'Q4' END\n)\nSELECT quarter\n     , ROUND(100.0 * online_2020 / online_2019, 0) AS online_pct_of_2019\n     , ROUND(100.0 * store_2020 / store_2019, 0)   AS store_pct_of_2019\n     , ROUND((online_2020 + store_2020) / 1000000.0, 2) AS revenue_2020_m\n     , ROUND((online_2019 + store_2019) / 1000000.0, 2) AS revenue_2019_m\nFROM q\nORDER BY quarter", "result": "qtr", "pre": {"title": "Step 0: revenue per year and the date range", "sql": "SELECT YEAR(s.Order_Date) AS order_year\n     , ROUND(SUM(s.Quantity * p.Unit_Price_USD) / 1000000.0, 2) AS revenue_m\n     , MIN(s.Order_Date) AS first_day\n     , MAX(s.Order_Date) AS last_day\nFROM GBE_Sales s\nJOIN GBE_Products p ON p.ProductKey = s.ProductKey\nGROUP BY YEAR(s.Order_Date)\nORDER BY order_year", "result": "years"}, "watch": ["T-SQL has no QUARTER() function. A CASE on MONTH() works in every dialect.", "A pivot with CASE WHEN keeps both years on one row, so the percent is a plain division."]}, "results": {"years": {"cols": ["order_year", "revenue_m", "first_day", "last_day"], "rows": [[2016, 6.95, "2016-01-01", "2016-12-31"], [2017, 7.42, "2017-01-01", "2017-12-31"], [2018, 12.79, "2018-01-01", "2018-12-31"], [2019, 18.26, "2019-01-01", "2019-12-31"], [2020, 9.29, "2020-01-01", "2020-12-31"], [2021, 1.04, "2021-01-01", "2021-02-20"]]}, "qtr": {"cols": ["quarter", "online_pct_of_2019", "store_pct_of_2019", "revenue_2020_m", "revenue_2019_m"], "rows": [["Q1", 101.0, 102.0, 4.97, 4.89], ["Q2", 69.0, 56.0, 1.86, 3.15], ["Q3", 30.0, 29.0, 1.31, 4.46], ["Q4", 22.0, 20.0, 1.15, 5.77]]}}, "metrics": [["2020 as % of 2019", "Revenue in a 2020 quarter ÷ revenue in the same 2019 quarter × 100."], ["Annual change", "2020 revenue ÷ 2019 revenue − 1."], ["Online share", "Online revenue ÷ total revenue in the year."]], "viz_specs": [{"type": "line", "result": "qtr", "x": "quarter", "series": [{"col": "online_pct_of_2019", "label": "Online"}, {"col": "store_pct_of_2019", "label": "Stores"}], "fmt": "pct0", "title": "Both channels fall away after the first quarter", "sub": "2020 revenue as a percent of the same quarter in 2019.", "why": "Two channels across four quarters: two lines on the same scale."}], "answer": {"model": ["Revenue fell 49% in 2020, from $18.3M to $9.3M, and online did not cushion it for long.", "Q1 was level with 2019 in both channels. In Q2 online held up better (69% of 2019 against 56% for stores), but by Q3 online was at 30% and stores at 29%, and in Q4 at 22% and 20%.", "Do not build next year's plan on online alone: it fell nearly as far as the stores. The data shows what dropped, not why, so ask Operations whether stock, delivery or demand caused it."], "checks": ["I compared the same quarter across two years.", "I split online from stores.", "I checked the date range.", "I gave one action and one caveat."]}}, {"id": "fuzzy-device", "dataset": "fuzzy", "title": "Which device should get the extra search budget?", "minutes": 25, "rank": "B", "skills": ["unit economics", "LEFT JOIN grain", "z-test + CI"], "brief": {"from_": "Maya Tran, Head of Growth", "subject": "+30% on Google non-brand search: where should it go?", "body": ["We sell plush toys online. Nearly all paid traffic comes from Google non-brand search, and Finance approved <b>30% more budget<\/b> there.", "Our agency quotes about <b>$2.50 per click<\/b>, the same on desktop and mobile. Treat one click as one website session. Use the <b>last 6 months<\/b> (19 Sep 2014 to 18 Mar 2015): the site changed a lot before that.", "Is the extra budget worth it, and on which device? I have five minutes on Friday."], "ask": "Deliver a three-sentence answer: the call, the evidence, the action.", "facts": ["Channel: <code>utm_source = 'gsearch'<\/code> and <code>utm_campaign = 'nonbrand'<\/code>.", "The $2.50 click price comes from Maya, not from the database."]}, "questions": ["What does one click earn after product cost and refunds?", "Is that the same on desktop and mobile?", "Is the gap real or noise?"], "frame": {"nudge": "Every click costs money and earns money. What do we <i>earn<\/i> per click after product cost and refunds, and is that the same for every kind of visitor?", "tree": ["<b>Is more budget worth it?<\/b>", ["Earn per session vs $2.50 paid per session", "Does earn-per-session differ by device?", "Is any gap real or noise, and stable over months?"]], "hyp": ["Desktop earns more per session than mobile.", "Mobile sits below break-even at $2.50, desktop above."], "traps": ["Revenue is not profit: subtract cost of goods and refunds.", "Sessions without an order earn $0 but still cost a click: divide by all sessions.", "Three years of data mix very different sites: use the recent window.", "Text <code>'NULL'<\/code> in UTM columns means direct/organic traffic."]}, "data": {"tables": [["website_sessions", 1, "Every click is a session; holds channel, campaign and device."], ["orders", 1, "Price and cost per order, linked to the session."], ["order_item_refunds", 1, "Profit is not revenue: refunds must come off."], ["order_items", 0, "Order-level price and cost already sit in orders."], ["website_pageviews", 0, "Funnel data; not needed for click economics."]], "grain": ["<code>website_sessions<\/code>: one row per visit. Start here so non-buyers stay.", "<code>orders<\/code>: at most one order per session. <b>LEFT JOIN<\/b> from sessions.", "<code>order_item_refunds<\/code>: several rows per order for 8 orders. <b>Pre-aggregate<\/b> per order before joining."], "goal": "One row per device: sessions, orders, conversion rate, revenue and net margin per session.", "skeleton": "WITH refunds AS (\n    SELECT order_id, SUM(refund_amount_usd) AS refund_usd\n    FROM order_item_refunds GROUP BY order_id\n)\nSELECT s.device_type\n     , COUNT(*) AS sessions\n     , COUNT(____) AS orders          -- which column is NULL when there is no order?\n     , ...                            -- conversion rate %\n     , ...                            -- net margin per session\nFROM website_sessions s\nLEFT JOIN orders o  ON ____\nLEFT JOIN refunds r ON r.order_id = o.order_id\nWHERE ____                            -- channel and 6-month window\nGROUP BY s.device_type", "solution": "WITH refunds AS (\n    SELECT order_id, SUM(refund_amount_usd) AS refund_usd\n    FROM order_item_refunds\n    GROUP BY order_id\n)\nSELECT s.device_type\n     , COUNT(*)                                          AS sessions\n     , COUNT(o.order_id)                                 AS orders\n     , ROUND(100.0 * COUNT(o.order_id) / COUNT(*), 2)    AS cvr_pct\n     , ROUND(SUM(o.price_usd) / COUNT(*), 3)             AS revenue_per_session\n     , ROUND(SUM(o.price_usd - o.cogs_usd - COALESCE(r.refund_usd, 0)) / COUNT(*), 3) AS net_margin_per_session\nFROM website_sessions s\nLEFT JOIN orders o  ON o.website_session_id = s.website_session_id\nLEFT JOIN refunds r ON r.order_id = o.order_id\nWHERE s.utm_source = 'gsearch' AND s.utm_campaign = 'nonbrand'\n  AND s.created_at >= '2014-09-19' AND s.created_at < '2015-03-19'\nGROUP BY s.device_type", "result": "device", "watch": ["INNER JOIN to orders drops every non-buyer, so conversion reads 100%.", "Averaging only over buyers gives margin per order, not per click.", "BETWEEN with an end date misses most of the last day on datetimes: use >= and <."]}, "results": {"device": {"cols": ["device_type", "sessions", "orders", "cvr_pct", "revenue_per_session", "net_margin_per_session"], "rows": [["desktop", 55590, 5651, 10.17, 6.466, 3.868], ["mobile", 24984, 889, 3.56, 2.251, 1.358]]}, "monthly": {"cols": ["yr_month", "desktop_cvr", "mobile_cvr"], "rows": [[201409, 9.14, 2.64], [201410, 9.18, 3.19], [201411, 10.08, 3.22], [201412, 9.99, 4.04], [201501, 10.41, 3.8], [201502, 11.03, 3.89], [201503, 10.6, 3.37]]}, "viz": {"cols": ["device", "net_margin_per_session", "ci_low", "ci_high"], "rows": [["Desktop", 3.867766144990136, 3.7632149173847456, 3.9723173725955263], ["Mobile", 1.357622478386166, 1.2625223894580053, 1.4527225673143265]]}}, "extra_sql": {"title": "Month by month, desktop vs mobile (pivot with conditional aggregation, feeds the line chart)", "sql": "SELECT YEAR(s.created_at) * 100 + MONTH(s.created_at) AS yr_month\n     , ROUND(100.0 * SUM(CASE WHEN s.device_type = 'desktop' AND o.order_id IS NOT NULL THEN 1 ELSE 0 END)\n             / SUM(CASE WHEN s.device_type = 'desktop' THEN 1 ELSE 0 END), 2) AS desktop_cvr\n     , ROUND(100.0 * SUM(CASE WHEN s.device_type = 'mobile' AND o.order_id IS NOT NULL THEN 1 ELSE 0 END)\n             / SUM(CASE WHEN s.device_type = 'mobile' THEN 1 ELSE 0 END), 2) AS mobile_cvr\nFROM website_sessions s\nLEFT JOIN orders o ON o.website_session_id = s.website_session_id\nWHERE s.utm_source = 'gsearch' AND s.utm_campaign = 'nonbrand'\n  AND s.created_at >= '2014-09-19' AND s.created_at < '2015-03-19'\nGROUP BY YEAR(s.created_at) * 100 + MONTH(s.created_at)\nORDER BY yr_month", "result": "monthly"}, "metrics": [["Conversion rate", "Orders ÷ sessions (session grain)."], ["Net margin per session", "(Revenue − cost of goods − refunds) ÷ <b>all<\/b> sessions."], ["Break-even click price", "Equals net margin per session: pay less and the click makes money."], ["Profit per click", "Net margin per session − $2.50."]], "viz_specs": [{"type": "bar", "result": "viz", "x": "device", "series": [{"col": "net_margin_per_session", "label": "Net margin per session"}], "err": ["ci_low", "ci_high"], "fmt": "usd", "colors": [0, 1], "ref": {"v": 2.5, "label": "Click price $2.50"}, "title": "Desktop clears the $2.50 click price; mobile does not", "sub": "Net margin per session, 19 Sep 2014 to 18 Mar 2015. Whiskers: 95% CI.", "why": "Two values against a threshold: bars from zero plus a price line. Whiskers show uncertainty."}, {"type": "line", "result": "monthly", "x": "yr_month", "xfmt": "ym", "series": [{"col": "desktop_cvr", "label": "Desktop"}, {"col": "mobile_cvr", "label": "Mobile"}], "fmt": "pct2", "title": "The gap shows up every month", "sub": "Conversion rate by month and device. First and last month are partial.", "why": "Change over time: lines, same colour per device in both charts."}], "stats": {"prompt": "Desktop converts at 10.2%, mobile at 3.6%. Which approach shows the gap is not luck?", "options": [["Paired t-test", 0, "Desktop and mobile are different visits, not pairs."], ["Two-proportion z-test plus a CI for the difference", 1, "Yes/no outcome per session in two independent groups; the CI gives the size of the gap."], ["Correlation of device and revenue", 0, "Device is a category; correlation does not give the gap in business terms."], ["No test, the chart is obvious", 0, "A decision needs an interval you can defend."]], "tiles": [["Conversion gap", "6.61 pts", "95% CI 6.27 to 6.95", false], ["z statistic", "31.8", "p < 0.0001", false], ["Desktop margin / session", "$3.87", "95% CI $3.76 to $3.97", false], ["Mobile margin / session", "$1.36", "95% CI $1.26 to $1.45", false]], "read": ["Desktop's whole interval sits <b>above<\/b> $2.50. Mobile's sits <b>below<\/b>. The verdict does not hinge on noise.", "Margin intervals use a Welch (unequal variance) interval on session-level margin; with 25k+ sessions per group the normal approximation is fine."], "watch": ["A tiny p-value does not say <i>why<\/i>. We compared groups; mobile ads may use other keywords or pages.", "Most sessions earn $0, so check the interval, not just the mean."]}, "answer": {"model": ["Yes for desktop, no for mobile. At $2.50 a click desktop makes money and mobile loses it, so the extra budget should go to desktop only.", "A desktop session earns $3.87 net margin (after cost of goods and refunds), a mobile session $1.36. That is $1.37 profit per desktop click and -$1.14 per mobile click. Desktop converts 10.2% of sessions against 3.6% on mobile (gap 6.6 points, 95% CI 6.3 to 6.9) and leads every month.", "About 4,029 extra clicks a month on desktop is worth about $5,510 a month, against $2,375 if spread like today. Lower mobile bids below $1.26 a click or pause mobile. Caveat: click price usually rises with volume, so raise desktop bids in steps; we have not tested why mobile converts worse."], "checks": ["My first sentence is the call (yes / no / where).", "I used net margin per session over all sessions, not revenue.", "I compared each device with the $2.50 click price.", "I quoted an interval, and one caveat."]}, "whatif": {"cpc": 2.5, "margins": [["Desktop", 3.867766144990136], ["Mobile", 1.357622478386166]], "clicks": 13429.0, "share": 0.6899247896343734}}, {"id": "fuzzy-refunds", "dataset": "fuzzy", "title": "Refunds jumped this summer. Blip or trend, and which product?", "minutes": 20, "rank": "B", "skills": ["rate by group", "time series", "z-test + CI"], "brief": {"from_": "Dan Okoye, Head of Operations", "subject": "Refund rate: is something broken?", "body": ["Refund numbers looked ugly in the autumn review, and I cannot tell whether it is one product, one bad month or a new normal.", "Please check <b>May 2014 onward<\/b>. Define the refund rate as <b>items refunded ÷ items sold<\/b>, grouped by the month the item was bought.", "If something broke, I need to know which product and when, so I can chase the supplier."], "ask": "Deliver three sentences: which product, how big and for how long, and what Dan should do.", "facts": ["Window: items bought from 1 May 2014 to 19 Mar 2015.", "Tables hold items sold (<code>order_items<\/code>), refunds and the product list."]}, "questions": ["Which product has an unusual refund rate?", "When did the spike start, and did it persist?", "Is the spike bigger than the normal ups and downs?"], "frame": {"nudge": "A rate has a top and a bottom. Which product, which month? Split the overall rate in two directions before you decide anything.", "tree": ["<b>Is the refund rate a problem?<\/b>", ["Which product(s) have an unusual rate?", "When did it start and does it persist? (month by month)", "Is the spike bigger than normal ups and downs?"]], "hyp": ["One product drives the spike.", "The spike is limited to a few months and then returns to normal.", "A product can have a high rate without a spike: check both views."], "traps": ["Count refunded <i>items<\/i> against items <i>sold<\/i>, not against refund rows or orders.", "Group by purchase month; refunds arrive later but belong to the sale.", "Compare against the other products in the same months, not against a different period.", "The product with the highest overall rate is not necessarily the one with the spike: look at the rate over time as well as the total."]}, "data": {"tables": [["order_items", 1, "Items sold: product and purchase date."], ["order_item_refunds", 1, "Which items were refunded."], ["products", 1, "Product names."], ["orders", 0, "Header level; items are the right grain for an item rate."], ["website_sessions", 0, "Traffic data; not needed."]], "grain": ["<code>order_items<\/code>: one row per item sold. This is the <b>denominator<\/b>.", "<code>order_item_refunds<\/code>: at most one row per refunded item (<b>LEFT JOIN<\/b> to keep non-refunded items).", const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const fmt=(v,d=2)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=(v,d=2)=>(v<0?'−':'')+'$'+fmt(Math.abs(v),d);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CH=DATA.challenges, byId=Object.fromEntries(CH.map(c=>[c.id,c]));
const RANKS={C:'C · Junior',B:'B · Analyst',A:'A · Senior'};

const STRETCH=new Set(['fuzzy','loyalty']);
let state={view:LS.get('view')||'hub',step:+(LS.get('step')||1)};
const isDone=id=>LS.get('done:'+id)==='1';

/* ---------- helpers ---------- */
const KW='SELECT|FROM|WHERE|GROUP BY|ORDER BY|JOIN|LEFT JOIN|INNER JOIN|ON|AND|OR|NOT|IN|AS|WITH|CASE|WHEN|THEN|ELSE|END|IS|NULL|COUNT|SUM|AVG|MIN|MAX|ROUND|COALESCE|DISTINCT|UNION ALL|YEAR|MONTH|BY|DESC|ASC';
const KWRE=new RegExp('(--[^\\n]*)|(\'[^\']*\')|(_{4,}|\\.\\.\\.)|\\b('+KW+')\\b','gi');
function hl(sql){return esc(sql).replace(KWRE,(m,c,s,b,k)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:b?`<span class="b">${b}</span>`:`<span class="k">${k}</span>`);}
const sqlBlock=s=>`<pre class="sql">${hl(s)}</pre>`;
function cell(col,v){
  if(v===null||v===undefined)return '';
  if(typeof v!=='number')return esc(v);
  if(/yr_month/.test(col)){const s=String(v);return s.slice(0,4)+'-'+s.slice(4);}
  if(/year$/i.test(col))return String(v);
  return fmt(v,Number.isInteger(v)?0:(Math.abs(v)<100?2:0)).replace(/\.00$/,'');
}
function table(r){return `<div class="tbl-wrap"><table class="r"><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.rows.map(row=>'<tr>'+row.map((v,i)=>`<td>${cell(r.cols[i],v)}</td>`).join('')+'</tr>').join('')}</table></div>`;}
function tree(a){let h='<ul class="tree">';for(let i=0;i<a.length;i++){if(Array.isArray(a[i]))continue;h+='<li>'+a[i]+(Array.isArray(a[i+1])?'<ul>'+a[i+1].map(x=>`<li>${x}</li>`).join('')+'</ul>':'')+'</li>';}return h+'</ul>';}
const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';

/* ---------- hub ---------- */
function hub(){
  $('#hdr').innerHTML=`<div class="eyebrow">TheHauData Mentoring Program</div><h1>Case Study Practice Zone</h1>
   <p>Junior-level case studies on the class databases. Each takes 15 to 20 minutes and has three steps: read the context, plan your approach, then solve, chart and conclude. Hints, expected SQL and model answers stay closed until you open them.</p>`;
  const card=c=>`<button class="cc" data-open="${c.id}"><span class="rank ${c.rank}" style="align-self:flex-start">${RANKS[c.rank]}</span><b>${c.title}</b><span class="sk">${c.skills.join(' · ')}</span>
       <span class="row"><span class="tm">⏱ ${c.minutes} min</span>${isDone(c.id)?'<span class="dn">✓ Done</span>':''}</span></button>`;
  const dsOrder=Object.keys(DATA.datasets);
  let h='<div class="hub"><div class="legend-r"><b>Rank = difficulty:</b> <span class="rank C">C · Junior</span> one or two tables, one clear metric <span class="rank B">B · Analyst</span> a few tables, a judgment call <span class="rank A">A · Senior</span> a trap in the obvious comparison</div>';
  [false,true].forEach(stretch=>{
    if(stretch)h+='<div class="legend-r"><b>Stretch:</b> harder cases on other databases, for after the core set.</div>';
    dsOrder.filter(k=>STRETCH.has(k)===stretch).forEach(k=>{const d=DATA.datasets[k], list=CH.filter(c=>c.dataset===k); if(!list.length)return;
      h+=`<section><div class="dshead"><h2>${d.name}</h2><span>${d.sub} · database ${d.db}</span></div><div class="cards">`+list.map(card).join('')+`</div></section>`;});
  });
  h+='</div>';
  $('#main').innerHTML=h;
  $$('[data-open]').forEach(b=>b.onclick=()=>openCh(b.dataset.open));
}
function openCh(id){state={view:id,step:1};LS.set('view',id);LS.set('step',1);draw();window.scrollTo({top:0});}
function toHub(){state={view:'hub',step:1};LS.set('view','hub');draw();window.scrollTo({top:0});}

/* ---------- challenge shell ---------- */
function challenge(c){
  const d=DATA.datasets[c.dataset];
  $('#hdr').innerHTML=`<button class="back" id="bk">← All challenges</button><div class="eyebrow" style="margin-top:6px">${d.name} · ${d.db}</div><h1>${c.title}</h1>
   <div class="metachips"><span class="rank ${c.rank}">${RANKS[c.rank]}</span><span class="metachip">⏱ ${c.minutes} min</span><span class="metachip">${c.skills.join(' · ')}</span></div>
   <nav class="stepper" role="tablist" id="stp">${STEPS.map((s,i)=>`<button role="tab" data-s="${i+1}" aria-selected="${state.step===i+1}" class="${isDone(c.id)||i+1<state.step?'done':''}"><span class="dot">${isDone(c.id)||i+1<state.step?'✓':i+1}</span>${s[0]} <small>${s[1]}</small></button>`).join('')}</nav>`;
  $('#bk').onclick=toHub;
  $$('#stp [data-s]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.s;LS.set('step',state.step);draw();window.scrollTo({top:0});});
  const body=[context,approach,solveAll][state.step-1](c);
  $('#main').innerHTML=`<section class="stack" style="padding-top:20px">${body}</section><div class="nav2">${state.step>1?'<button class="btn" id="pv">← Back</button>':'<span></span>'}${state.step<3?`<button class="btn primary" id="nx">${['Plan the approach →','Solve it →'][state.step-1]}</button>`:'<button class="btn" id="rs">Reset this challenge</button>'}</div>`;
  const go=n=>{state.step=n;LS.set('step',n);draw();window.scrollTo({top:0});};
  if($('#pv'))$('#pv').onclick=()=>go(state.step-1); if($('#nx'))$('#nx').onclick=()=>go(state.step+1);
  if($('#rs'))$('#rs').onclick=e=>{const b=e.currentTarget; if(!b.dataset.a){b.dataset.a=1;b.textContent='Click again to clear notes and progress';setTimeout(()=>{delete b.dataset.a;b.textContent='Reset this challenge'},4000);return;}
    ['done:'+c.id,'n:'+c.id+':f','n:'+c.id+':a'].forEach(LS.del);LS.del('chk:'+c.id);draw();};
  after(c);
}
let afterFns=[];const after=c=>{afterFns.forEach(f=>f(c));afterFns=[];};

/* ---------- 1 context ---------- */
function context(c){const b=c.brief;
  return `<div class="card mail"><h2><small>Incoming request</small></h2><div class="hd"><span><b>From:</b> ${b.from_}</span><span><b>To:</b> You, Data Analyst</span><span><b>Subject:</b> ${b.subject}</span></div>
   ${b.body.map(p=>`<p>${p}</p>`).join('')}</div>

   <div class="card"><h2><small>Key questions</small> What you need to answer</h2><ol class="kq">${c.questions.map(q=>`<li>${q}</li>`).join('')}</ol></div>
   <div class="ask">${b.ask}</div>`;
}

/* ---------- 2 approach ---------- */
function approach(c){const f=c.frame, k='n:'+c.id+':f';
  afterFns.push(()=>{const t=$('#fnote');t.value=LS.get(k)||'';t.oninput=()=>LS.set(k,t.value);setupPicks(c);});
  return `<div class="lead"><span>Do not touch the data yet. <b>Think first:</b> write your plan below, then open the hints one at a time.</span></div>
   <div class="card"><h2><small>Your turn</small> Sketch your approach</h2><textarea id="fnote" placeholder="Which decision sits behind this? Which metrics would you compute? Which tables? What could mislead you?"></textarea><p class="note" style="margin-top:6px">Saved only in this browser.</p></div>
   <div class="card"><h2><small>Hints</small> Open only what you need</h2>
    <details class="reveal"><summary>Hint 1 · A nudge</summary><p>${f.nudge}</p></details>
    <details class="reveal"><summary>Hint 2 · How to break it down</summary>${tree(f.tree)}<p style="margin:8px 0 2px"><b>Hypotheses to test</b></p>${li(f.hyp)}</details>
    <details class="reveal"><summary>Hint 3 · What usually goes wrong</summary>${li(f.traps)}</details>
    <details class="reveal"><summary>Suggested metrics (define your own first)</summary><div class="tbl-wrap"><table class="j mt"><tr><th>Metric</th><th>Definition</th></tr>${c.metrics.map(m=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join('')}</table></div></details>
    <details class="reveal"><summary>Suggested tables (pick yours, then check)</summary><div class="picks" id="picks"></div><div style="margin-top:8px"><button class="btn primary" id="chk">Check my choice</button></div><div class="fb" id="pfb" aria-live="polite"></div></details></div>`;
}

/* ---------- 3 solve, visualize, conclude ---------- */
function solveAll(c){
  const d=c.data, R=c.results, k='n:'+c.id+':a', ck='chk:'+c.id; let n=0;
  afterFns.push(()=>{setupQuiz(c);drawCharts(c);$$('[data-tbl]').forEach(b=>b.onclick=()=>{const t=$('#'+b.dataset.tbl),on=t.hidden;t.hidden=!on;b.setAttribute('aria-pressed',on);b.textContent=on?'Hide table':'Show table';});
    const t=$('#anote');t.value=LS.get(k)||'';t.oninput=()=>LS.set(k,t.value);
    let saved=[];try{saved=JSON.parse(LS.get(ck)||'[]')}catch(e){}
    $$('#rub input').forEach((x,i)=>{x.checked=!!saved[i];x.onchange=upd;});upd();
    function upd(){const all=$$('#rub input'),m=all.filter(x=>x.checked).length;LS.set(ck,JSON.stringify(all.map(x=>x.checked)));
      if(m===all.length){LS.set('done:'+c.id,'1');}else LS.del('done:'+c.id);$('#closed').classList.toggle('on',m===all.length);}
    if(c.whatif)whatif(c);});
  const pre=d.pre?`<p><b>${d.pre.title}</b></p>${sqlBlock(d.pre.sql)}${table(R[d.pre.result])}`:'';
  const b1=`<details class="blk" open><summary><span class="n">${++n}</span> Solve it</summary><div class="bd">
    <p><b>Goal.</b> ${d.goal}</p><p class="note">Write the query yourself first. Open a hint only when you are stuck.</p>
    <details class="reveal"><summary>Hint · Grain and joins</summary>${li(d.grain)}</details>
    <details class="reveal"><summary>Hint · Query skeleton</summary>${sqlBlock(d.skeleton)}</details>
    <details class="reveal"><summary>Expected T-SQL and output</summary>${pre}${sqlBlock(d.solution)}<p><b>Expected output</b> <span class="note">(DuckDB run on the CSV files, with the exact query above)</span></p>${table(R[d.result])}${c.extra_sql?`<p><b>${c.extra_sql.title}</b></p>${sqlBlock(c.extra_sql.sql)}${table(R[c.extra_sql.result])}`:''}
     <div class="card pit"><h2><small>Watch out</small></h2>${li(d.watch)}</div></details></div></details>`;
  const figs=c.viz_specs.map((v,i)=>`<div class="figure"><h3>${v.title}</h3><div class="sub">${v.sub}</div>${v.series.length>1?`<div class="legend">${v.series.map((s,j)=>`<span><i class="${v.type==='bar'?'sq':''}" style="background:var(--c${j+1})"></i>${s.label}</span>`).join('')}</div>`:''}
    <div class="ch" id="ch${i}"></div><div><button class="btn" data-tbl="tb${i}" aria-pressed="false">Show table</button></div><div class="tbl-wrap" id="tb${i}" hidden>${table(R[v.result])}</div><p class="note" style="margin-top:6px"><b>Why this chart:</b> ${v.why}</p></div>`).join('');
  const b2=`<details class="blk"><summary><span class="n">${++n}</span> Visualize</summary><div class="bd"><p class="note">Decide which chart you would build before you open ours.</p><details class="reveal"><summary>Show the suggested chart${c.viz_specs.length>1?'s':''}</summary><div class="figs">${figs}</div></details></div></details>`;
  let b3='';
  if(c.dig){b3+=`<details class="blk"><summary><span class="n">${++n}</span> Dig one level deeper</summary><div class="bd"><p><b>${c.dig.title}</b></p><details class="reveal"><summary>Show the query and output</summary>${sqlBlock(c.dig.sql)}${table(R[c.dig.result])}<p>${c.dig.read}</p></details></div></details>`;}
  if(c.stats){const s=c.stats;
    b3+=`<details class="blk"><summary><span class="n">${++n}</span> Test it (statistics)</summary><div class="bd"><p>${s.prompt}</p><div class="check" id="quiz">${s.options.map((o,i)=>`<label><input type="radio" name="qz" value="${i}"> <span>${o[0]}</span></label>`).join('')}</div><div class="fb" id="qfb" aria-live="polite"></div>
    <div class="stat">${s.tiles.map(t=>`<div class="${t[3]?'neg':''}"><b>${t[0]}</b><span>${t[1]}</span><small>${t[2]}</small></div>`).join('')}</div>${li(s.read)}<div class="card pit"><h2><small>Watch out</small></h2>${li(s.watch)}</div></div></details>`;}
  const wi=c.whatif?`<div class="card"><h2><small>What-if</small> Click price vs profit</h2><label for="cpc" style="font-size:13px;color:var(--muted)">Click price <b id="cpcv" style="color:var(--fg)">$2.50</b></label><input type="range" id="cpc" min="0.5" max="5" step="0.05" value="2.5" style="width:100%"><div class="stat" id="wif" aria-live="polite" style="margin-top:8px"></div></div>`:'';
  const b4=`<details class="blk"><summary><span class="n">${++n}</span> Conclude</summary><div class="bd">${wi}<p class="note" style="margin:0">Write three sentences: the call, the evidence with numbers, the action and one caveat.</p><textarea id="anote" style="min-height:120px"></textarea>
    <details class="reveal"><summary>Show the model answer</summary>${c.answer.model.map(p=>`<p>${p}</p>`).join('')}</details>
    <p style="margin:6px 0 4px"><b>Self-check</b> (tick when your answer does it)</p><div class="check" id="rub">${c.answer.checks.map(x=>`<label><input type="checkbox"> <span>${x}</span></label>`).join('')}</div>
    <div class="closed" id="closed">✓ Case complete: ${c.title}</div></div></details>`;
  return b1+b2+b3+b4;
}
function setupPicks(c){const sel=new Set(), T=c.data.tables;
  $('#picks').innerHTML=T.map(t=>`<button class="chip" aria-pressed="false" data-t="${t[0]}">${t[0]}</button>`).join('');
  $$('#picks .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.t;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k));});
  $('#chk').onclick=()=>{$('#pfb').innerHTML=T.map(([n,need,why])=>{const s=sel.has(n),g=(s===!!need);return `<div class="${g?'y':'n'}"><b>${g?'✓':'✗'} ${n}</b> ${s&&!need?'selected, but ':(!s&&need?'missing. ':'')}${why}</div>`;}).join('');};}
function setupQuiz(c){if(!c.stats)return;$$('#quiz input').forEach(r=>r.onchange=()=>{const o=c.stats.options[+r.value];$('#qfb').innerHTML=`<div class="${o[1]?'y':'n'}"><b>${o[1]?'✓ Right.':'✗ Not quite.'}</b> ${o[2]}</div>`;});}

/* ---------- charts ---------- */
const COL=i=>`var(--c${i+1})`;
const ymLabel=v=>{const s=String(v);return s.slice(2,4)+'-'+s.slice(4);};
function nice(max){const p=Math.pow(10,Math.floor(Math.log10(max))),n=max/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
const FM={m1:v=>(v<0?'−':'')+'$'+fmt(Math.abs(v),1)+'M',m2:v=>(v<0?'−':'')+'$'+fmt(Math.abs(v),2)+'M',usd0:v=>(v<0?'−':'')+'$'+fmt(Math.abs(v),0),pct0:v=>(v<0?'−':'')+fmt(Math.abs(v),0)+'%',num1:v=>fmt(v,1),usd:v=>usd(v),pct1:v=>fmt(v,1)+'%',pct2:v=>fmt(v,2)+'%',int:v=>fmt(v,0)};
function tipEl(h){let t=$('.tip',h);if(!t){t=document.createElement('div');t.className='tip';h.appendChild(t);}return t;}
function drawCharts(c){c.viz_specs.forEach((v,i)=>{const host=$('#ch'+i);if(!host)return;const r=c.results[v.result];({bar:drawBar,dots:drawBar,line:drawLine})[v.type](host,v,r);});}
function colIdx(r,n){return r.cols.indexOf(n);}
function drawBar(host,v,r){
  const W=Math.max(host.clientWidth,260),H=300,m={l:52,r:12,t:22,b:v.x==='driver'||W<420?54:34};const nb=r.rows.length,rot=(W-m.l-m.r)/nb<78&&r.rows.some(x=>String(x[colIdx(r,v.x)]).length>6);if(rot)m.b=84;
  const xi=colIdx(r,v.x),F=FM[v.fmt],ser=v.series,iw=W-m.l-m.r,ih=H-m.t-m.b;
  const lo=v.err?colIdx(r,v.err[0]):-1,hi=v.err?colIdx(r,v.err[1]):-1;
  let maxv=Math.max(...r.rows.flatMap(row=>ser.map(s=>row[colIdx(r,s.col)]).concat(hi>=0?[row[hi]]:[]),v.ref?[v.ref.v]:[]));
  const minv=Math.min(0,...r.rows.flatMap(row=>ser.map(s=>row[colIdx(r,s.col)])));let ymin=v.ymin??(minv<0?-nice(-minv*1.15):0),ymax=v.ymax??nice(maxv*1.12);let tstep=(ymax-ymin)/5;if(v.ymin===undefined&&minv<0){tstep=nice((ymax-ymin)/5);ymin=-Math.ceil(-ymin/tstep)*tstep;ymax=Math.ceil(ymax/tstep)*tstep;}const y=val=>m.t+ih-((val-ymin)/(ymax-ymin))*ih;const base=y(Math.max(ymin,0));
  const step=iw/r.rows.length,bw=Math.min(78,step*.6/ser.length);let g='';
  const tk=Math.round((ymax-ymin)/tstep);for(let k=0;k<=tk;k++){const tv=ymin+tstep*k;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)"/><text x="${m.l-8}" y="${y(tv)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${F(tv).replace('.0%','%')}</text>`;}
  if(ymin<0)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${base}" y2="${base}" stroke="var(--fg)" stroke-width="1"/>`;
  r.rows.forEach((row,ri)=>{const cx=m.l+step*ri+step/2;
    ser.forEach((s,si)=>{const val=row[colIdx(r,s.col)],bx=cx-(bw*ser.length)/2+si*bw,top=y(val),col=v.colors&&ser.length===1?COL(v.colors[ri]):COL(si),r4=4;
      if(v.type==='dots'){g+=`<circle cx="${cx}" cy="${top}" r="6" fill="${COL(0)}"/>`;}
      else g+=`<rect x="${bx+1}" y="${Math.min(top,base)}" width="${bw-2}" height="${Math.max(1,Math.abs(top-base))}" rx="3" fill="${col}"/>`;
      let lbl=val<0?top+16:top-8;
      if(lo>=0){const a=y(row[lo]),b=y(row[hi]);g+=`<line x1="${cx}" x2="${cx}" y1="${a}" y2="${b}" stroke="var(--fg)" stroke-width="1.5"/><line x1="${cx-6}" x2="${cx+6}" y1="${a}" y2="${a}" stroke="var(--fg)" stroke-width="1.5"/><line x1="${cx-6}" x2="${cx+6}" y1="${b}" y2="${b}" stroke="var(--fg)" stroke-width="1.5"/>`;lbl=b-8;}
      g+=`<text x="${bx+bw/2}" y="${lbl}" text-anchor="middle" font-size="${bw<40?9:(ser.length>1?12:14)}" font-weight="700" fill="var(--fg)">${F(val)}</text>`;});
    const lab=String(row[xi]);const parts=lab.length>14&&W<560?lab.split(' '):[lab];
    g+=rot?`<text transform="translate(${cx+4},${H-m.b+14}) rotate(-35)" text-anchor="end" font-size="12" fill="var(--fg)">${esc(lab)}</text>`:parts.map((p,pi)=>`<text x="${cx}" y="${H-m.b+18+pi*14}" text-anchor="middle" font-size="12.5" fill="var(--fg)">${esc(p)}</text>`).join('');
    g+=`<rect x="${cx-step/2}" y="${m.t}" width="${step}" height="${ih}" fill="transparent" class="hit" data-i="${ri}"/>`;});
  if(v.ref)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v.ref.v)}" y2="${y(v.ref.v)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-m.r}" y="${y(v.ref.v)-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--fg)">${esc(v.ref.label)}</text>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.title)}">${g}</svg>`;
  const tip=tipEl(host);
  $$('.hit',host).forEach(el=>{el.onmousemove=e=>{const row=r.rows[+el.dataset.i],b=host.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.min(e.clientX-b.left+12,W-190)+'px';tip.style.top=(e.clientY-b.top-10)+'px';
    tip.innerHTML=`<b>${esc(row[xi])}</b><br>`+ser.map(s=>`${s.label}: ${F(row[colIdx(r,s.col)])}`).join('<br>')+(lo>=0?`<br>95% CI ${F(row[lo])} to ${F(row[hi])}`:'');};el.onmouseleave=()=>tip.style.display='none';});
}
function drawLine(host,v,r){
  const W=Math.max(host.clientWidth,260),H=300,m={l:46,r:W<420?20:96,t:16,b:40},xi=colIdx(r,v.x),F=FM[v.fmt],iw=W-m.l-m.r,ih=H-m.t-m.b,n=r.rows.length;
  const maxv=Math.max(...r.rows.flatMap(row=>v.series.map(s=>row[colIdx(r,s.col)]))),ymax=nice(maxv*1.1),y=val=>m.t+ih-(val/ymax)*ih,x=i=>m.l+iw*(i/(n-1));let g='';
  for(let k=0;k<=4;k++){const tv=ymax*k/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)"/><text x="${m.l-8}" y="${y(tv)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${F(tv).replace('.0%','%')}</text>`;}
  const lab=row=>v.xfmt==='ym'?ymLabel(row[xi]):row[xi];
  r.rows.forEach((row,i)=>{if(W>=420||i%2===0)g+=`<text x="${x(i)}" y="${H-16}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab(row)}</text>`;});
  v.series.forEach((s,si)=>{const ci=colIdx(r,s.col),pts=r.rows.map((row,i)=>[x(i),y(row[ci])]);
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${COL(si)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${COL(si)}" stroke="var(--surface)" stroke-width="2"/>`);
    if(W>=420){const last=r.rows[n-1][ci];g+=`<text x="${x(n-1)+10}" y="${y(last)+4}" font-size="12" font-weight="700" fill="var(--fg)">${esc(s.label.split(' ').slice(-1)[0])} ${F(last)}</text>`;}});
  g+=`<line id="cr" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hl"/>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.title)}">${g}</svg>`;
  const tip=tipEl(host),cr=$('#cr',host);
  $('#hl',host).onmousemove=e=>{const b=host.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round(((e.clientX-b.left-m.l)/iw)*(n-1))));cr.setAttribute('x1',x(i));cr.setAttribute('x2',x(i));cr.style.display='';
    tip.style.display='block';tip.style.left=Math.min(x(i)+12,W-190)+'px';tip.style.top='8px';tip.innerHTML=`<b>${lab(r.rows[i])}</b><br>`+v.series.map(s=>`${s.label}: ${F(r.rows[i][colIdx(r,s.col)])}`).join('<br>');};
  $('#hl',host).onmouseleave=()=>{tip.style.display='none';cr.style.display='none';};
}

function whatif(c){const w=c.whatif,extra=w.clicks*0.3;
  const draw=()=>{const p=+$('#cpc').value;$('#cpcv').textContent=usd(p);const d=w.margins[0][1]-p,m=w.margins[1][1]-p,mix=extra*(w.share*d+(1-w.share)*m),only=extra*d;
    const t=(a,b,s,neg)=>`<div class="${neg?'neg':''}"><b>${a}</b><span>${b}</span><small>${s}</small></div>`;
    $('#wif').innerHTML=t('Desktop profit / click',usd(d),d>=0?'above break-even':'below break-even',d<0)+t('Mobile profit / click',usd(m),m>=0?'above break-even':'below break-even',m<0)+t('+30% like today\'s mix',usd(mix,0)+' / mo',fmt(extra,0)+' extra clicks',mix<0)+t('+30% all desktop',usd(only,0)+' / mo','same clicks',only<0);};
  $('#cpc').oninput=draw;draw();}

/* ---------- main ---------- */
function draw(){afterFns=[];if(state.view==='hub'||!byId[state.view])hub();else challenge(byId[state.view]);}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const c=byId[state.view];if(c&&state.step===3)drawCharts(c);},150);});
document.addEventListener('toggle',e=>{const c=byId[state.view];if(c&&state.step===3&&e.target.open)drawCharts(c);},true);
draw();
</script>
</body>
